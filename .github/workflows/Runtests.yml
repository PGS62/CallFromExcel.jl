name: Runtests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
            julia-version: ['1.10', '1'] # oldest supported (LTS), latest
            julia-arch: [x64]
            os: [windows-latest] # [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The add-in in dotnet-addin/dist is committed, because Pkg.add users don't build it.
  # Rebuild it from source here and fail if the result differs from what is committed.
  reproducible-addin:
    runs-on: windows-latest
    steps:
      # Line endings get into the build output, and dist/ is built from a CRLF checkout.
      # (Not enforced with eol=crlf in .gitattributes: git archive would apply that too,
      # breaking the tree hash the General registry checks.)
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet-addin/global.json
      - name: Build the add-in (Release)
        working-directory: dotnet-addin/CallFromExcel.AddIn
        run: dotnet build -c Release
      - name: Compare with the committed dotnet-addin/dist
        shell: bash
        run: |
          git status --porcelain -- dotnet-addin/dist
          git diff --exit-code --stat -- dotnet-addin/dist
          test -z "$(git status --porcelain -- dotnet-addin/dist)"

  # The General registry checks that `git archive` of a registered commit unpacks to exactly
  # the commit's tree (its "Treecheck"). .gitattributes rules such as eol=crlf break that.
  archive-treehash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # Tar.tree_hash is what Pkg and the registry use; it ignores .gitattributes, unlike
      # re-adding the unpacked files to git, which would undo an eol conversion and pass.
      - name: git archive reproduces the tree hash
        run: |
          julia -e '
              using Tar
              expected = readchomp(`git rev-parse "HEAD^{tree}"`)
              actual = Tar.tree_hash(open(`git archive HEAD`))
              println("tree $expected, archive $actual")
              expected == actual || exit(1)'
